{% extends "base.html" %}
{% block head %}
<style>
  body { background: var(--paper); }
  .auth { min-height: 100vh; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); }
  .auth-art {
    background: var(--pine); color: #fff; padding: 40px 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
    position: relative; overflow: hidden;
  }
  .auth-art h1 { font-size: clamp(30px, 3.6vw, 48px); line-height: 1.08; max-width: 14ch; }
  .auth-art p { color: rgba(255,255,255,.72); font-size: 17px; max-width: 38ch; margin-top: 16px; }

  /* A miniature booking board: the product, not a stock illustration. */
  .mini-board { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 18px; padding: 18px; max-width: 520px; }
  .mini-row { display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 12px; padding: 8px 0; }
  .mini-row + .mini-row { border-top: 1px solid rgba(255,255,255,.08); }
  .mini-row span { font-size: 13px; color: rgba(255,255,255,.7); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mini-track { position: relative; height: 28px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 1px, transparent 1px calc(100% / 14)); border-radius: 6px; }
  .mini-track i {
    position: absolute; top: 3px; bottom: 3px; border-radius: 6px; background: #557A6C;
  }
  .mini-track i.sun { background: var(--sun); }

  .auth-form-side { display: flex; align-items: center; justify-content: center; padding: 40px 24px; background: var(--fog); }
  .auth-card { width: 100%; max-width: 400px; }
  .auth-card h2 { font-size: 26px; margin-bottom: 8px; }
  .auth-card > p { color: var(--stone); margin-bottom: 28px; }
  .auth-card form { display: grid; gap: 16px; }
  .auth-card .btn { width: 100%; height: 48px; margin-top: 4px; }
  .auth-switch { margin-top: 24px; text-align: center; color: var(--stone); }
  .auth-err { background: var(--rose-soft); color: var(--rose); padding: 12px 16px; border-radius: var(--r-sm); font-weight: 500; font-size: 15px; }
  .brand-dark .brand-name { color: #fff; }

  @media (max-width: 860px) {
    .auth { grid-template-columns: 1fr; }
    .auth-art { padding: 28px 20px; gap: 24px; }
    .mini-board, .auth-art p { display: none; }
    .auth-art h1 { font-size: 28px; max-width: none; }
  }
</style>
{% endblock %}
{% block body %}
<div class="auth">
  <aside class="auth-art">
    <a class="brand" href="/">
      <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#2B5446"/><rect x="7" y="9" width="18" height="4" rx="2" fill="#EEF1EE"/><rect x="7" y="15" width="11" height="4" rx="2" fill="#F2B544"/><rect x="7" y="21" width="14" height="4" rx="2" fill="#EEF1EE"/></svg>
      <span class="brand-name">CoWork <span>Booking</span></span>
    </a>
    <div>
      <h1>Переговорна на 10:00 — за пів хвилини</h1>
      <p>Бачите вільні години всіх просторів одразу й бронюєте в один клік, без дзвінків на ресепшн.</p>
    </div>
    <div class="mini-board" aria-hidden="true">
      <div class="mini-row"><span>Карпати</span><div class="mini-track"><i style="left:7%;width:21%"></i><i class="sun" style="left:43%;width:14%"></i></div></div>
      <div class="mini-row"><span>Говерла</span><div class="mini-track"><i style="left:21%;width:29%"></i><i style="left:64%;width:14%"></i></div></div>
      <div class="mini-row"><span>Місце 12</span><div class="mini-track"><i style="left:0;width:50%"></i><i style="left:71%;width:21%"></i></div></div>
    </div>
  </aside>
  <div class="auth-form-side">
    <div class="auth-card">{% block auth %}{% endblock %}</div>
  </div>
</div>
{% endblock %}
