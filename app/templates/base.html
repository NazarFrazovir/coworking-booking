<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CoWork Booking{% endblock %}</title>
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#6b7280; --accent:#2f6fed; --danger:#c0392b; --border:#e3e6eb; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
    header { background:var(--card); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
    header a { color:var(--text); text-decoration:none; font-weight:600; }
    main { max-width:880px; margin:32px auto; padding:0 16px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:24px; margin-bottom:20px; }
    .narrow { max-width:400px; margin-left:auto; margin-right:auto; }
    label { display:block; margin:12px 0 4px; font-size:14px; color:var(--muted); }
    input { width:100%; padding:9px 10px; border:1px solid var(--border); border-radius:6px; font-size:15px; }
    button { margin-top:16px; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:9px 16px; font-size:15px; cursor:pointer; }
    button.link { background:none; color:var(--accent); padding:0; margin:0; }
    .error { background:#fdecea; color:var(--danger); padding:10px; border-radius:6px; font-size:14px; }
    .badge { display:inline-block; font-size:12px; padding:2px 8px; border-radius:999px; background:#e8efff; color:var(--accent); }
    .badge.admin { background:#fdecea; color:var(--danger); }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:8px; border-bottom:1px solid var(--border); }
    .stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:12px; }
    .stat { background:var(--bg); border-radius:8px; padding:14px; }
    .stat b { display:block; font-size:26px; }
    .muted { color:var(--muted); font-size:14px; }
  </style>
</head>
<body>
  <header>
    <a href="/">CoWork Booking</a>
    {% if user %}
      <form method="post" action="/logout" style="margin:0">
        <span class="muted">{{ user.email }}</span>
        <span class="badge {{ 'admin' if user.is_admin }}">{{ user.role }}</span>
        &nbsp;<button class="link" type="submit">Вийти</button>
      </form>
    {% endif %}
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
