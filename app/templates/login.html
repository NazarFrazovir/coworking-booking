{% extends "_auth.html" %}
{% block title %}Вхід — CoWork Booking{% endblock %}
{% block auth %}
<h2>З поверненням</h2>
<p>Увійдіть, щоб побачити розклад і свої бронювання.</p>
<form method="post" action="/login">
  {% if error %}<div class="auth-err" role="alert">{{ error }}</div>{% endif %}
  <div><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required autofocus></div>
  <div><label for="password">Пароль</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
  <button class="btn" type="submit">Увійти</button>
</form>
<p class="auth-switch">Ще немає акаунта? <a href="/register">Зареєструватися</a></p>
{% endblock %}
