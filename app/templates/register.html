{% extends "_auth.html" %}
{% block title %}Реєстрація — CoWork Booking{% endblock %}
{% block auth %}
<h2>Створіть акаунт</h2>
<p>Займе хвилину. Бронювати можна одразу після реєстрації.</p>
<form method="post" action="/register">
  {% if error %}<div class="auth-err" role="alert">{{ error }}</div>{% endif %}
  <div><label for="full_name">Імʼя та прізвище</label><input id="full_name" name="full_name" value="{{ full_name or '' }}" autocomplete="name" required autofocus></div>
  <div><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="email" required></div>
  <div><label for="password">Пароль</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" placeholder="Щонайменше 8 символів" required></div>
  <button class="btn" type="submit">Створити акаунт</button>
</form>
<p class="auth-switch">Вже є акаунт? <a href="/login">Увійти</a></p>
{% endblock %}
