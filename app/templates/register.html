{% extends "base.html" %}
{% block title %}Реєстрація — CoWork Booking{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>Реєстрація</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/register">
    <label for="full_name">Ім'я та прізвище</label>
    <input id="full_name" name="full_name" value="{{ full_name or '' }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" required>
    <label for="password">Пароль (мін. 8 символів)</label>
    <input id="password" name="password" type="password" minlength="8" required>
    <button type="submit">Створити акаунт</button>
  </form>
  <p class="muted">Вже є акаунт? <a href="/login">Увійти</a></p>
</div>
{% endblock %}
