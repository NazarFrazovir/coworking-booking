# CI for CoWork Booking (lab #3, variant A).
# Runs on every push to main and on every pull request:
#   1. lint      — ruff + black, and a guard that no .env file got committed
#   2. tests     — pytest on SQLite (fast) for Python 3.12 and 3.13
#   3. postgres  — Alembic migrations + the full pytest suite on a real
#                  PostgreSQL 16, the same engine production uses
# The pull request can be merged only when all jobs are green
# (enable "Require status checks" in the branch protection settings).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff, black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters
        run: pip install ruff==0.6.9 black==24.8.0

      - name: ruff
        run: ruff check . --output-format=github

      - name: black
        run: black --check --diff .

      - name: No secrets committed
        run: |
          leaked=$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '\.example$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::Environment files must not be committed: $leaked"
            exit 1
          fi

  tests:
    name: Tests (Python ${{ matrix.python }}, SQLite)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: pytest
        run: pytest -v --junitxml=report-${{ matrix.python }}.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report-${{ matrix.python }}
          path: report-${{ matrix.python }}.xml

  postgres:
    name: Migrations + tests on PostgreSQL
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: coworking_sandbox_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # The CI database is a throwaway sandbox; nothing here is a real secret.
      APP_ENV: sandbox
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: coworking_sandbox_ci
      POSTGRES_USER: ci
      POSTGRES_PASSWORD: ci-password
      JWT_SECRET_KEY: ci-only-jwt-secret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Apply migrations (upgrade → downgrade → upgrade)
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Production config refuses unsafe settings
        run: |
          # Valid production DB + strong key, so the ONLY problem is DEBUG.
          export POSTGRES_DB=coworking_production
          export JWT_SECRET_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
          if out=$(APP_ENV=production DEBUG=true python -c "import app.main" 2>&1); then
            echo "::error::production started with DEBUG=true"; exit 1
          fi
          echo "$out" | grep -q "DEBUG must be false"
          echo "OK: production refuses DEBUG=true"

      - name: pytest on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://ci:ci-password@localhost:5432/coworking_sandbox_ci
        run: |
          alembic downgrade base
          pytest -v
